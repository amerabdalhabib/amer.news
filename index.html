<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amer.News — Global Wire & Feed Aggregator</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=Playfair+Display:ital,wght@0,600;0,700;0,800;1,600&family=Noto+Serif+Bengali:wght@500;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 width=%2232%22 height=%2232%22 fill=%22none%22><path fill=%22%23B20F03%22 d=%22M16 3a13 13 0 1 0 13 13A13.015 13.015 0 0 0 16 3m0 24a11 11 0 1 1 11-11 11.01 11.01 0 0 1-11 11%22/><path fill=%22%23B20F03%22 d=%22M17.038 18.615H14.87L14.563 9.5h2.78zəm-1.084 1.427q.66 0 1.057.388.407.389.407.994 0 .596-.407.984-.397.39-1.057.389-.65 0-1.056-.389-.398-.389-.398-.984 0-.597.398-.985.406-.397 1.056-.397%22/></svg>">
    <meta http-equiv="refresh" content="360">
</head>
<body>
    <div class="main-wrapper" role="document">
        <div class="sticky-wrapper">
            <header>
                <div class="container header-top">
                    <a href="index.html" class="brand-zone">
                        <img src="https://amerhabib.com/ah_icon.png" alt="AH" class="logo" width="30" height="30">
                        <div class="brand-text-wrap">
                            <h1>Amer.News</h1>
                            <span class="sub-brand">Wire Desk</span>
                        </div>
                    </a>
                    <div class="header-right-group">
                        <button class="icon-btn search-toggle-btn" onclick="toggleSearch()" title="Search">
                            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                        </button>
                        <button class="icon-btn" id="theme-btn" onclick="toggleTheme()" title="Toggle Theme"></button>
                    </div>
                </div>
            </header>

            <div id="ticker-bar" class="ticker-bar" style="display: none;">
                <div class="container ticker-flex">
                    <span class="ticker-label">LIVE WIRE</span>
                    <div class="ticker-wrap">
                        <div id="ticker-track" class="ticker-track"></div>
                    </div>
                </div>
            </div>
        </div>

        <div id="search-container" class="search-container container" style="display: none;">
            <div class="search-inner">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
                <input type="text" id="search-box" placeholder="Search headlines, summaries, sources..." autocomplete="off">
                <button id="search-clear-btn" class="search-clear-btn" onclick="clearSearch()" style="display:none;" title="Clear search">×</button>
            </div>
        </div>

        <main class="container">
            <div class="controls-row">
                <div class="controls-left">
                    <button class="filter-dropdown-btn" onclick="toggleFilterModal()">
                        <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/></svg>
                        <span>Customize Feed</span>
                    </button>
                    <select id="sort-box" class="sort-select" aria-label="Sort order">
                        <option value="newest">Newest first</option>
                        <option value="oldest">Oldest first</option>
                        <option value="bookmarks">Saved bookmarks</option>
                    </select>
                </div>

                <div class="controls-right">
                    <div class="segmented-control" id="layout-segmented">
                        <div class="seg-slider" id="seg-slider"></div>
                        <button class="seg-btn active" data-view="grid-4" title="4-Column Grid">
                            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="4" height="18"/><rect x="10" y="3" width="4" height="18"/><rect x="17" y="3" width="4" height="18"/></svg>
                        </button>
                        <button class="seg-btn" data-view="grid-2" title="2-Column Grid">
                            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="8" height="18"/><rect x="13" y="3" width="8" height="18"/></svg>
                        </button>
                        <button class="seg-btn" data-view="masonry" title="Masonry Layout">
                            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="8"/><rect x="3" y="13" width="8" height="8"/><rect x="13" y="13" width="8" height="8"/></svg>
                        </button>
                        <button class="seg-btn" data-view="text" title="Compact Text">
                            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
                        </button>
                    </div>
                </div>
            </div>

            <div id="news-container" class="layout-grid-4"></div>

            <div id="scroll-sentinel" class="scroll-sentinel"></div>
            <div class="load-more-fallback-wrap" style="text-align: center; margin: 30px 0;">
                <button id="load-more-btn" class="state-action" onclick="loadMoreManual()" style="display: none;">Load More Articles</button>
            </div>
        </main>

        <div id="filter-modal" class="filter-popover-overlay" onclick="closeFilterModal(event)">
            <div class="filter-popover-content">
                <div class="filter-popover-header">
                    <h3>Customize Your Feed</h3>
                    <button class="close-filter-popover" onclick="closeFilterModal()">×</button>
                </div>
                <div class="filter-popover-body">
                    <div class="filter-section">
                        <label>Language</label>
                        <div id="lang-filter-container" class="capsules-row">
                            <button class="capsule active" data-lang="All">All languages</button>
                            <button class="capsule" data-lang="English">English</button>
                            <button class="capsule" data-lang="Bangla">Bangla</button>
                        </div>
                    </div>
                    <div class="filter-section">
                        <label>Topics & Tags</label>
                        <div id="filter-container" class="capsules-row"></div>
                    </div>
                    <div class="filter-section">
                        <label>News Sources</label>
                        <div id="source-filter-container" class="capsules-row"></div>
                    </div>
                </div>
                <div class="filter-popover-footer">
                    <button class="reset-filters-btn" onclick="clearAllFilters()">Reset All Filters</button>
                    <button class="apply-filters-btn" onclick="closeFilterModal()">Apply & Close</button>
                </div>
            </div>
        </div>

        <div class="floating-action-group">
            <button class="floating-btn" id="floating-filter-btn" onclick="toggleFilterModal()" title="Customize Feed">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/></svg>
            </button>
            <button class="floating-btn" id="back-to-top" onclick="window.scrollTo({top:0, behavior:'smooth'})" title="Back to top" style="display:none;">
                <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="18 15 12 9 6 15"/></svg>
            </button>
        </div>

        <footer>
            <div class="container footer-content">
                <div class="footer-left">
                    <span>Amer.News &copy; 2026</span>
                    <span class="dot-sep">•</span>
                    <span id="live-datetime"></span>
                </div>
                <div class="footer-right">
                    <a href="https://amerhabib.com" target="_blank" rel="noopener">amerhabib.com</a>
                </div>
            </div>
        </footer>
    </div>

    <div id="toast" class="toast"></div>
    <script src="script.js"></script>
</body>
</html>
