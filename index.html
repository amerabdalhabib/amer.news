<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Amer.News | Real-Time News Aggregator</title>
    
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    
    <script src="https://unpkg.com/lucide@latest"></script>

    <style>
        :root {
            --bg-color: #f8fafc;
            --surface-color: #ffffff;
            --text-primary: #0f172a;
            --text-secondary: #64748b;
            --border-color: #e2e8f0;
            --primary-brand: #2563eb;
            --primary-hover: #1d4ed8;
            --tag-bg: #eff6ff;
            --tag-text: #1e40af;
            --shadow-sm: 0 1px 2px 0 rgba(0, 0, 0, 0.05);
            --shadow-md: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
            --radius-md: 8px;
            --radius-lg: 12px;
        }

        [data-theme="dark"] {
            --bg-color: #0f172a;
            --surface-color: #1e293b;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --border-color: #334155;
            --primary-brand: #3b82f6;
            --primary-hover: #60a5fa;
            --tag-bg: #1e3a8a;
            --tag-text: #bfdbfe;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            margin: 0;
            padding: 0;
            line-height: 1.5;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        a { text-decoration: none; color: inherit; }

        .container {
            max-width: 1280px;
            margin: 0 auto;
            padding: 0 1.5rem;
        }

        header {
            background-color: var(--surface-color);
            border-bottom: 1px solid var(--border-color);
            position: sticky;
            top: 0;
            z-index: 50;
            padding: 1rem 0;
        }

        .header-content {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 1rem;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 1.5rem;
            font-weight: 800;
            color: var(--text-primary);
            letter-spacing: -0.025em;
        }

        .search-bar {
            flex-grow: 1;
            max-width: 400px;
            position: relative;
            display: none;
        }

        @media (min-width: 640px) { .search-bar { display: block; } }

        .search-bar input {
            width: 100%;
            padding: 0.6rem 1rem 0.6rem 2.5rem;
            border-radius: 9999px;
            border: 1px solid var(--border-color);
            background-color: var(--bg-color);
            color: var(--text-primary);
            outline: none;
            transition: border-color 0.2s;
        }

        .search-bar input:focus { border-color: var(--primary-brand); }
        .search-icon { position: absolute; left: 0.75rem; top: 50%; transform: translateY(-50%); color: var(--text-secondary); width: 18px;}

        .header-actions {
            display: flex;
            align-items: center;
            gap: 1rem;
        }

        .icon-btn {
            background: none;
            border: none;
            color: var(--text-secondary);
            cursor: pointer;
            padding: 0.5rem;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background-color 0.2s, color 0.2s;
        }

        .icon-btn:hover {
            background-color: var(--bg-color);
            color: var(--text-primary);
        }

        .current-date-display {
            text-align: center;
            font-size: 0.85rem;
            color: var(--text-secondary);
            margin-top: 0.5rem;
            font-weight: 500;
        }

        .controls-section {
            padding: 1.5rem 0;
            display: flex;
            flex-direction: column;
            gap: 1rem;
        }

        @media (min-width: 768px) {
            .controls-section { flex-direction: row; justify-content: space-between; align-items: flex-start; }
        }

        .tags-filter {
            display: flex;
            flex-wrap: wrap;
            gap: 0.5rem;
            flex-grow: 1;
        }

        .filter-btn {
            background-color: var(--surface-color);
            border: 1px solid var(--border-color);
            color: var(--text-secondary);
            padding: 0.4rem 1rem;
            border-radius: 9999px;
            font-size: 0.85rem;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s;
        }

        .filter-btn:hover { border-color: var(--text-secondary); }
        
        .filter-btn.active {
            background-color: var(--primary-brand);
            color: white;
            border-color: var(--primary-brand);
        }

        .date-filter select {
            padding: 0.5rem 1rem;
            border-radius: var(--radius-md);
            border: 1px solid var(--border-color);
            background-color: var(--surface-color);
            color: var(--text-primary);
            font-size: 0.9rem;
            outline: none;
            cursor: pointer;
        }

        .news-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 1.5rem;
            padding-bottom: 3rem;
        }

        .card {
            background-color: var(--surface-color);
            border-radius: var(--radius-lg);
            border: 1px solid var(--border-color);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            transition: transform 0.2s, box-shadow 0.2s;
        }

        .card:hover {
            transform: translateY(-4px);
            box-shadow: var(--shadow-md);
        }

        .card-img {
            width: 100%;
            height: 180px;
            object-fit: cover;
            background-color: var(--border-color);
        }

        .card-content { padding: 1.25rem; display: flex; flex-direction: column; flex-grow: 1; }
        
        .card-tags { display: flex; flex-wrap: wrap; gap: 0.4rem; margin-bottom: 0.75rem; }
        .tag-pill {
            background-color: var(--tag-bg);
            color: var(--tag-text);
            font-size: 0.7rem;
            font-weight: 600;
            padding: 0.2rem 0.5rem;
            border-radius: 4px;
            text-transform: uppercase;
        }

        .card-title {
            font-size: 1.15rem;
            font-weight: 700;
            margin: 0 0 0.5rem 0;
            line-height: 1.3;
        }

        .card-title a:hover { color: var(--primary-brand); }

        .card-summary {
            font-size: 0.9rem;
            color: var(--text-secondary);
            margin: 0 0 1.25rem 0;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
            flex-grow: 1;
        }

        .card-footer {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: auto;
            padding-top: 1rem;
            border-top: 1px solid var(--border-color);
            font-size: 0.8rem;
            color: var(--text-secondary);
        }

        footer {
            background-color: var(--surface-color);
            border-top: 1px solid var(--border-color);
            padding: 2rem 0;
            text-align: center;
            color: var(--text-secondary);
            font-size: 0.9rem;
        }
        
        footer a { color: var(--primary-brand); font-weight: 600; }
        footer a:hover { text-decoration: underline; }

        .system-msg { text-align: center; grid-column: 1 / -1; padding: 4rem 0; color: var(--text-secondary); }
    </style>
</head>
<body>

    <header>
        <div class="container header-content">
            <a href="#" class="logo">
                <i data-lucide="globe-2"></i> Amer.News
            </a>

            <div class="search-bar">
                <i data-lucide="search" class="search-icon"></i>
                <input type="text" id="searchInput" placeholder="Search articles...">
            </div>

            <div class="header-actions">
                <button class="icon-btn" id="themeToggle" aria-label="Toggle Dark Mode">
                    <i data-lucide="moon" id="themeIcon"></i>
                </button>
                <button class="icon-btn" aria-label="Account">
                    <i data-lucide="user-circle"></i>
                </button>
            </div>
        </div>
        <div class="current-date-display container" id="headerDate">--</div>
    </header>

    <main class="container">
        
        <div class="controls-section">
            <div class="tags-filter" id="tagsContainer"></div>
            <div class="date-filter">
                <select id="dateDropdown">
                    <option value="ALL">All Dates</option>
                </select>
            </div>
        </div>

        <div id="news-grid" class="news-grid">
            <div class="system-msg">Fetching latest articles...</div>
        </div>
    </main>

    <footer>
        <div class="container">
            &copy; <span id="year"></span> Amer.News. Aggregating the world's stories.<br>
            <span style="display:inline-block; margin-top:8px;">
                Curated by <a href="https://amerhabib.com" target="_blank" rel="noopener">Amer Habib</a>
            </span>
        </div>
    </footer>

    <script>
        document.getElementById('year').textContent = new Date().getFullYear();
        document.getElementById('headerDate').textContent = new Date().toLocaleDateString("en-US", { weekday: 'long', year: 'numeric', month: 'long', day: 'numeric', timeZone: "Asia/Dhaka" });

        // Unique initialization variables to prevent double declaration errors
        const SUPABASE_URL = 'https://jwagtkzvhlidkbleraie.supabase.co'; 
        const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imp3YWd0a3p2aGxpZGtibGVyYWllIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODQxODI5MjAsImV4cCI6MjA5OTc1ODkyMH0.HrYbyhxtCSNN5x8ZgySBtvs7cMjh94IACmGnIRbDU5Q';
        const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

        let allArticles = [];
        let activeTag = 'ALL';
        let activeDate = 'ALL';
        let activeSearch = '';

        const grid = document.getElementById('news-grid');
        const tagsContainer = document.getElementById('tagsContainer');
        const dateDropdown = document.getElementById('dateDropdown');
        const searchInput = document.getElementById('searchInput');

        async function init() {
            try {
                console.log("Fetching from Supabase...");
                const { data, error } = await supabaseClient
                    .from('news_articles') 
                    .select('*')
                    .order('published_at', { ascending: false })
                    .limit(200);

                if (error) throw error;
                
                allArticles = data || [];
                console.log("Fetched articles count:", allArticles.length);
                
                if(allArticles.length === 0){
                    grid.innerHTML = '<div class="system-msg">No articles found in the database.</div>';
                    return;
                }

                buildFilters();
                applyFilters();

            } catch (err) {
                console.error("Error loading news:", err);
                grid.innerHTML = `<div class="system-msg" style="color:red;">Error loading news: ${err.message}</div>`;
            }
        }

        function buildFilters() {
            const uniqueTags = new Set();
            const uniqueDates = new Set();

            allArticles.forEach(article => {
                if (article.tags) {
                    let parsedTags = [];
                    try { 
                        parsedTags = typeof article.tags === 'string' ? JSON.parse(article.tags) : article.tags; 
                    } catch(e) { 
                        if (typeof article.tags === 'string') parsedTags = article.tags.split(','); 
                    }
                    
                    if (Array.isArray(parsedTags)) {
                        parsedTags.forEach(tag => {
                            const cleanTag = String(tag).trim();
                            if (cleanTag && cleanTag !== article.source_name && cleanTag !== "Top News") {
                                uniqueTags.add(cleanTag);
                            }
                        });
                    }
                }

                if (article.published_at) {
                    try {
                        const dateObj = new Date(article.published_at);
                        const dayString = dateObj.toLocaleDateString("en-US", { 
                            timeZone: "Asia/Dhaka", month: 'short', day: 'numeric', year: 'numeric' 
                        });
                        if (dayString !== "Invalid Date") uniqueDates.add(dayString);
                    } catch(e) {}
                }
            });

            tagsContainer.innerHTML = `<button class="filter-btn active" data-tag="ALL">All News</button>`;
            Array.from(uniqueTags).sort().slice(0, 8).forEach(tag => {
                tagsContainer.innerHTML += `<button class="filter-btn" data-tag="${tag}">${tag}</button>`;
            });

            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.addEventListener('click', (e) => {
                    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                    e.target.classList.add('active');
                    activeTag = e.target.getAttribute('data-tag');
                    applyFilters();
                });
            });

            const currentSelectedDate = dateDropdown.value;
            dateDropdown.innerHTML = `<option value="ALL">All Dates</option>`;
            Array.from(uniqueDates).forEach(dateStr => {
                const opt = document.createElement('option');
                opt.value = dateStr;
                opt.textContent = dateStr;
                dateDropdown.appendChild(opt);
            });
            dateDropdown.value = currentSelectedDate;

            dateDropdown.addEventListener('change', (e) => {
                activeDate = e.target.value;
                applyFilters();
            });
        }

        searchInput.addEventListener('input', (e) => {
            activeSearch = e.target.value.toLowerCase();
            applyFilters();
        });

        function applyFilters() {
            const filtered = allArticles.filter(article => {
                let matchesTag = activeTag === 'ALL';
                if (!matchesTag && article.tags) {
                    const strTags = JSON.stringify(article.tags).toLowerCase();
                    matchesTag = strTags.includes(activeTag.toLowerCase());
                }

                let matchesDate = activeDate === 'ALL';
                if (!matchesDate && article.published_at) {
                    try {
                        const articleDate = new Date(article.published_at).toLocaleDateString("en-US", { timeZone: "Asia/Dhaka", month: 'short', day: 'numeric', year: 'numeric' });
                        matchesDate = articleDate === activeDate;
                    } catch(e) {}
                }

                let matchesSearch = activeSearch === '';
                if (!matchesSearch) {
                    const title = (article.title || '').toLowerCase();
                    const summary = (article.summary || '').toLowerCase();
                    matchesSearch = title.includes(activeSearch) || summary.includes(activeSearch);
                }

                return matchesTag && matchesDate && matchesSearch;
            });

            renderGrid(filtered);
        }

        function renderGrid(articles) {
            grid.innerHTML = '';
            
            if (articles.length === 0) {
                grid.innerHTML = '<div class="system-msg">No articles match your criteria.</div>';
                return;
            }

            articles.forEach(article => {
                const card = document.createElement('article');
                card.className = 'card';

                const fallbackImg = 'data:image/svg+xml;charset=UTF-8,%3Csvg%20width%3D%22800%22%20height%3D%22400%22%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20fill%3D%22%23e2e8f0%22%3E%3Crect%20width%3D%22100%25%22%20height%3D%22100%25%22%2F%3E%3C%2Fsvg%3E';
                const img = article.image_url || fallbackImg;

                let timeStr = 'Unknown';
                if (article.published_at) {
                    try {
                        timeStr = new Date(article.published_at).toLocaleTimeString("en-US", {
                            timeZone: "Asia/Dhaka", hour: 'numeric', minute: '2-digit', hour12: true
                        });
                    } catch(e) {}
                }

                card.innerHTML = `
                    <img class="card-img" src="${img}" alt="News Image" loading="lazy">
                    <div class="card-content">
                        <div class="card-tags">
                            <span class="tag-pill">${article.source_name || 'News'}</span>
                        </div>
                        <h2 class="card-title">
                            <a href="${article.url}" target="_blank" rel="noopener">${article.title || 'Untitled'}</a>
                        </h2>
                        <p class="card-summary">${article.summary || ''}</p>
                        <div class="card-footer">
                            <span>${article.language || 'English'}</span>
                            <span>${timeStr}</span>
                        </div>
                    </div>
                `;
                grid.appendChild(card);
            });
        }

        const themeToggle = document.getElementById('themeToggle');
        const themeIcon = document.getElementById('themeIcon');
        
        if (localStorage.getItem('theme') === 'dark') {
            document.body.setAttribute('data-theme', 'dark');
            themeIcon.setAttribute('data-lucide', 'sun');
        }

        themeToggle.addEventListener('click', () => {
            if (document.body.getAttribute('data-theme') === 'dark') {
                document.body.removeAttribute('data-theme');
                localStorage.setItem('theme', 'light');
                themeIcon.setAttribute('data-lucide', 'moon');
            } else {
                document.body.setAttribute('data-theme', 'dark');
                localStorage.setItem('theme', 'dark');
                themeIcon.setAttribute('data-lucide', 'sun');
            }
            lucide.createIcons();
        });

        // Initialize App
        init();
        setInterval(init, 30 * 60 * 1000);
    </script>
</body>
</html>
