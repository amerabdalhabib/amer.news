<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="description" content="Amer.News delivers the latest breaking daily news, curated and updated in real-time from top English and Bangla sources.">
    <meta name="keywords" content="news aggregator, breaking news, Bangladesh news, world news, Amer Habib, wire desk">
    <meta name="author" content="Amer Abdal Habib">
    <link rel="canonical" href="https://news.amerhabib.com/">

    <meta property="og:type" content="website">
    <meta property="og:title" content="Amer.News">
    <meta property="og:description" content="The latest daily news curated and delivered in real-time.">
    <meta property="og:image" content="https://amerhabib.com/public/ah_icon.png">
    <meta property="og:url" content="https://news.amerhabib.com/">
    <meta name="twitter:card" content="summary_large_image">

    <meta name="twitter:title" content="Amer.News — Wire Desk">
    <meta name="twitter:description" content="The latest daily news curated and delivered in real-time.">
    <meta name="twitter:image" content="https://amerhabib.com/public/ah_icon.png">
    
    <meta charset="UTF-8">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Amer.News</title>

    <link rel="icon" type="image/jpeg" href="https://amerhabib.com/public/ah_icon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Archivo+Narrow:wght@600;700;800&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">

    <script>
        const savedTheme = localStorage.getItem('theme') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.setAttribute('data-theme', savedTheme);
    </script>
    <style>
        :root {
            --paper: #f6f6f3;
            --paper-raised: #ffffff;
            --ink: #16171b;
            --ink-muted: #6b6d73;
            --line: #dcdcd6;
            --wire: #c4122f;
            --wire-soft: rgba(196, 18, 47, 0.08);
            --radius: 6px;
            --font-display: 'Archivo Narrow', sans-serif;
            --font-body: 'Inter', sans-serif;
            --font-mono: 'IBM Plex Mono', monospace;
        }
        [data-theme="dark"] {
            --paper: #131417;
            --paper-raised: #1b1c20;
            --ink: #f2f1ed;
            --ink-muted: #93949a;
            --line: #2a2b30;
            --wire: #ff5468;
            --wire-soft: rgba(255, 84, 104, 0.12);
        }
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html { -webkit-text-size-adjust: 100%; scroll-padding-top: 100px; }
        body { font-family: var(--font-body); background: var(--paper); color: var(--ink); line-height: 1.5; }
        body, .icon-btn, .capsule, .load-more, .modal-btn, .floating-filter-btn { transition: background 0.15s ease, color 0.15s ease, border-color 0.15s ease; }
        a { color: inherit; text-decoration: none; }
        button { font-family: inherit; }
        :focus-visible { outline: 2px solid var(--wire); outline-offset: 2px; }

        .container { margin: 0 auto; width: 92%; padding: 14px 0; max-width: 1600px; }
        @media (min-width: 1024px) { .container { width: 85%; } }

        /* ---------- Header ---------- */
        .sticky-wrapper { position: sticky; top: 0; background: var(--paper); z-index: 1000; border-bottom: 1px solid var(--line); }
        header { padding: 4px 0; }
        .header-top { display: flex; justify-content: space-between; align-items: center; gap: 10px; }

        .brand-zone { display: flex; align-items: center; gap: 10px; min-width: 0; text-decoration: none; color: inherit; cursor: pointer; }
        .logo { width: 30px; height: 30px; border-radius: 0%; object-fit: cover; flex-shrink: 0; }
        .brand-text-wrap { display: flex; flex-direction: column; justify-content: center; line-height: 1.1; }
        h1 { font-family: var(--font-display); font-size: 1.25rem; font-weight: 800; letter-spacing: -0.01em; white-space: nowrap; }
        
        .masthead-tag { font-family: var(--font-mono); font-size: 0.6rem; color: var(--ink-muted); text-transform: uppercase; letter-spacing: 0.08em; margin-top: 1px; }

        .utility-zone { display: flex; align-items: center; gap: 2px; font-size: 0.8rem; font-weight: 500; color: var(--ink-muted); flex-shrink: 0; }
        .live-clock { display: none; font-family: var(--font-mono); text-transform: uppercase; letter-spacing: 0.04em; margin-right: 8px; font-size: 0.75rem; }
        @media (min-width: 768px) { .live-clock { display: block; } }

        .icon-btn { background: none; border: none; color: var(--ink); cursor: pointer; display: flex; align-items: center; justify-content: center; width: 38px; height: 38px; border-radius: var(--radius); opacity: 0.75; }
        .icon-btn:hover { background: var(--wire-soft); opacity: 1; color: var(--wire); }
        .icon-btn svg { width: 18px; height: 18px; }

        #search-container { display: none; padding: 10px 0; border-top: 1px solid var(--line); position: relative; }
        .search-wrapper { display: flex; align-items: center; gap: 0; position: relative; }
        .search-box { width: 100%; padding: 11px 36px 11px 12px; border: 1px solid var(--line); background: var(--paper-raised); color: var(--ink); font-family: var(--font-body); border-radius: var(--radius); outline: none; font-size: 0.95rem; }
        .search-clear { position: absolute; right: 4px; top: 50%; transform: translateY(-50%); background: none; border: none; color: var(--ink-muted); cursor: pointer; width: 30px; height: 30px; display: none; align-items: center; justify-content: center; border-radius: 50%; padding: 0; }
        .search-clear:hover { background: var(--wire-soft); color: var(--wire); }
        .search-clear svg { width: 16px; height: 16px; }

        /* ---------- Live ticker ---------- */
        .ticker-bar { display: flex; align-items: center; gap: 10px; border-top: 1px solid var(--line); padding: 7px 0; overflow: hidden; }
        .ticker-live { display: flex; align-items: center; gap: 5px; flex-shrink: 0; font-family: var(--font-mono); font-size: 0.7rem; font-weight: 600; letter-spacing: 0.08em; color: var(--wire); text-transform: uppercase; }
        .ticker-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--wire); animation: pulse 1.6s ease-in-out infinite; flex-shrink: 0; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.25; } }
        .ticker-viewport { overflow: hidden; flex: 1; mask-image: linear-gradient(to right, transparent, black 24px, black calc(100% - 24px), transparent); -webkit-mask-image: linear-gradient(to right, transparent, black 24px, black calc(100% - 24px), transparent); }
        .ticker-track { display: flex; width: max-content; gap: 40px; font-family: var(--font-mono); font-size: 0.78rem; white-space: nowrap; animation: ticker-scroll 60.0s linear infinite; }
        .ticker-track:hover, .ticker-track.paused { animation-play-state: paused; }
        .ticker-track a { text-decoration: none; color: var(--ink-muted); }
        .ticker-track a:hover { color: var(--ink); }
        .ticker-sep { color: var(--line); }
        @keyframes ticker-scroll { from { transform: translateX(0); } to { transform: translateX(-50%); } }
        @media (prefers-reduced-motion: reduce) { .ticker-track { animation: none; } .ticker-viewport { overflow-x: auto; } .ticker-dot { animation: none; } }
        @media (max-width: 639px) { .ticker-bar { display: none; } }

        /* ---------- Controls ---------- */
        .controls-row { display: flex; flex-wrap: wrap; gap: 12px; justify-content: space-between; align-items: center; margin: 16px 0; font-size: 0.85rem; }
        .select-box { background: var(--paper-raised); border: 1px solid var(--line); outline: none; padding: 8px 24px 8px 10px; color: var(--ink); border-radius: var(--radius); cursor: pointer; font-family: inherit; font-weight: 600; font-size: 0.82rem; }

        .layout-segmented { position: relative; display: flex; align-items: center; background: var(--paper-raised); border: 1px solid var(--line); padding: 3px; border-radius: var(--radius); }
        .seg-slider { position: absolute; top: 3px; left: 0; height: calc(100% - 6px); background: var(--wire); border-radius: calc(var(--radius) - 2px); transition: transform 0.25s cubic-bezier(0.4, 0, 0.2, 1), width 0.25s cubic-bezier(0.4, 0, 0.2, 1); z-index: 1; }
        .seg-btn { position: relative; z-index: 2; background: none; border: none; outline: none; padding: 8px 12px; cursor: pointer; color: var(--ink-muted); display: flex; align-items: center; justify-content: center; min-width: 40px; min-height: 36px; }
        .seg-btn.active { color: #fff; }
        .seg-btn svg { width: 17px; height: 17px; }

        .seg-btn[data-view="grid-1"] { display: flex; }
        .seg-btn[data-view="grid-2"] { display: flex; }
        .seg-btn[data-view="grid-3"] { display: none; }
        .seg-btn[data-view="grid-4"] { display: none; }
        .seg-btn[data-view="list"] { display: none; }
        .seg-btn[data-view="text"] { display: flex; }
        .seg-btn[data-view="masonry"] { display: none; }

        @media (min-width: 768px) {
            .seg-btn[data-view="grid-3"] { display: flex; }
            .seg-btn[data-view="list"] { display: flex; }
            .seg-btn[data-view="masonry"] { display: flex; }
        }
        @media (min-width: 1024px) {
            .seg-btn[data-view="grid-4"] { display: flex; }
        }

        /* ---------- Filters ---------- */
        .filter-accordion { border: none; margin-bottom: 18px; font-size: 0.85rem; scroll-margin-top: 100px; }
        .filter-accordion summary { padding: 10px 0; font-weight: 600; cursor: pointer; list-style: none; display: flex; justify-content: space-between; align-items: center; outline: none; }
        .filter-accordion summary::-webkit-details-marker { display: none; }
        .filter-accordion summary:after { content: "Customise feed"; font-family: var(--font-mono); font-size: 0.7rem; color: var(--ink-muted); text-transform: uppercase; letter-spacing: 0.05em; }
        .filter-accordion[open] summary { margin-bottom: 12px; }
        .filter-accordion[open] summary:after { content: "Hide filters"; }

        .filter-group { margin-bottom: 15px; }
        .filter-label { display: block; font-family: var(--font-mono); font-size: 0.7rem; font-weight: 600; color: var(--ink-muted); margin-bottom: 8px; text-transform: uppercase; letter-spacing: 0.06em; }
        .filter-bar { display: flex; gap: 8px; flex-wrap: wrap; }

        .capsule { background: var(--paper-raised); color: var(--ink); border: 1px solid var(--line); padding: 7px 13px; border-radius: 99px; cursor: pointer; font-size: 0.8rem; font-weight: 500; min-height: 34px; }
        .capsule:hover { border-color: var(--wire); }
        .capsule.active { background: var(--ink); color: var(--paper); border-color: var(--ink); }

        .clear-filters-btn { display: inline-flex; align-items: center; gap: 5px; background: none; border: 1px dashed var(--ink-muted); color: var(--ink-muted); padding: 7px 13px; border-radius: 99px; cursor: pointer; font-size: 0.78rem; font-weight: 500; min-height: 34px; font-family: var(--font-mono); }
        .clear-filters-btn:hover { border-color: var(--wire); color: var(--wire); background: var(--wire-soft); }
        .clear-filters-btn svg { width: 14px; height: 14px; }

        /* ---------- Layout containers ---------- */
        .layout-grid-1 { display: flex; flex-direction: column; gap: 20px; max-width: 800px; margin: 0 auto; }
        .layout-grid-2 { display: grid; grid-template-columns: repeat(2, 1fr); gap: 20px; width: 100%; }
        .layout-grid-3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 24px; width: 100%; }
        .layout-grid-4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 20px; width: 100%; }
        .layout-list { display: flex; flex-direction: column; gap: 15px; width: 100%; }
        .layout-text { display: flex; flex-direction: column; gap: 0; max-width: 900px; margin: 0 auto; }

        @media (max-width: 767px) { .layout-grid-2, .layout-grid-3, .layout-grid-4 { grid-template-columns: 1fr; } }

        /* ---------- Masonry / Newspaper Layout ---------- */
        .layout-masonry { display: grid; grid-template-columns: 1fr; gap: 20px; width: 100%; }
        @media (min-width: 768px) { .layout-masonry { grid-template-columns: repeat(2, 1fr); } }
        @media (min-width: 1024px) { .layout-masonry { grid-template-columns: repeat(3, 1fr); } }
        .layout-masonry .news-card.span-2 { grid-column: span 1; }
        @media (min-width: 768px) { .layout-masonry .news-card.span-2 { grid-column: span 2; } }

        .news-card { display: flex; flex-direction: column; padding: 0; }
        .news-card.read { opacity: 0.55; }
        .news-card.no-image-card { background: var(--ink); color: var(--paper); padding: 20px; border-radius: var(--radius); display: flex; flex-direction: column; justify-content: flex-start; }
        .news-card.no-image-card .news-title { color: var(--paper); font-size: 1.15rem; }
        .news-card.no-image-card .news-title:hover { color: var(--wire); }
        .news-card.no-image-card .snippet { color: var(--ink-muted); }
        .news-card.no-image-card .meta { color: var(--ink-muted); margin-top: 4px; margin-bottom: 0; }
        .news-card.no-image-card .tag { background: rgba(255,255,255,0.1); border-color: rgba(255,255,255,0.2); color: var(--paper); }
        .news-card.no-image-card .bookmark-btn, .news-card.no-image-card .share-btn { color: var(--paper); }
        .news-card.no-image-card .bookmark-btn:hover, .news-card.no-image-card .share-btn:hover { background: rgba(255,255,255,0.15); color: var(--wire); }

        .card-image-wrap { position: relative; display: block; width: 100%; aspect-ratio: 16/10; background: var(--paper-raised); border-radius: var(--radius); overflow: hidden; margin-bottom: 12px; }
        .news-image { width: 100%; height: 100%; object-fit: cover; display: block; background: var(--paper-raised); }
        .layout-masonry .card-image-wrap { aspect-ratio: 16/10; background: transparent; }
        .layout-masonry .news-image { width: 100%; height: 100%; object-fit: cover; object-position: center center; display: block; background: transparent; }
        .no-image-placeholder { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; color: var(--ink-muted); font-family: var(--font-mono); font-size: 0.7rem; text-transform: uppercase; letter-spacing: 0.06em; }

        .news-content { display: flex; flex-direction: column; flex: 1; }
        .content-main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
        .bookmark-wrap { display: none; }
        .card-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 8px; gap: 8px; flex-wrap: wrap; }
        .tags-group { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
        .tag { font-family: var(--font-mono); font-size: 0.65rem; font-weight: 600; padding: 3px 8px; border-radius: 3px; cursor: pointer; border: 1px solid var(--line); background: var(--paper-raised); color: var(--ink-muted); display: inline-block; text-transform: uppercase; letter-spacing: 0.04em; white-space: nowrap; }
        .tag:hover { border-color: var(--wire); color: var(--wire); }
        .card-actions-group { display: flex; align-items: center; gap: 4px; flex-shrink: 0; }
        .bookmark-btn, .share-btn { background: none; border: none; cursor: pointer; color: var(--ink-muted); display: flex; align-items: center; justify-content: center; width: 34px; height: 34px; border-radius: var(--radius); padding: 0; flex-shrink: 0; }
        .bookmark-btn:hover, .share-btn:hover { background: var(--wire-soft); color: var(--wire); }
        .bookmark-btn.saved { color: var(--wire); }

        .news-title { display: block; color: var(--ink); text-decoration: none; font-family: var(--font-display); font-size: 1.05rem; font-weight: 700; line-height: 1.25; margin-bottom: 8px; }
        .news-title.bn-title { font-size: calc(1.05rem * 0.9); }
        @media (min-width: 768px) { .news-title { font-size: 1.15rem; } .news-title.bn-title { font-size: calc(1.15rem * 0.9); } }
        .news-title:hover { color: var(--wire); }
        .snippet { font-size: 0.8rem; color: var(--ink-muted); margin-bottom: 8px; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; line-height: 1.45; }
        @media (min-width: 768px) { .snippet { font-size: 0.85rem; } }
        .meta { color: var(--ink-muted); font-family: var(--font-mono); font-size: 0.7rem; display: flex; align-items: center; gap: 10px; margin-top: auto; flex-wrap: wrap; }
        .text-only-tags { display: none; gap: 6px; align-items: center; }

        .layout-masonry .news-card { justify-content: flex-start; }
        .layout-masonry .news-card .news-content { flex: 0 0 auto; }
        .layout-masonry .news-card .meta { margin-top: 4px; margin-bottom: 0; flex-grow: 0; }

        .layout-list .news-card { flex-direction: row; gap: 20px; align-items: flex-start; padding-bottom: 15px; border-bottom: 1px solid var(--line); width: 100%; }
        .layout-list .card-image-wrap { width: 240px; aspect-ratio: 16/10; flex-shrink: 0; margin-bottom: 0; }
        @media (max-width: 767px) { .layout-list .news-card { flex-direction: column; gap: 0; } .layout-list .card-image-wrap { width: 100%; margin-bottom: 12px; } }
        .layout-list .news-content { flex-direction: row; justify-content: space-between; width: 100%; }
        .layout-list .card-header .card-actions-group { display: none; }
        .layout-list .bookmark-wrap { display: flex; align-items: center; gap: 4px; flex-shrink: 0; margin-left: 15px; }

        .layout-text .news-card { flex-direction: row; padding: 13px 0; border-bottom: 1px solid var(--line); align-items: flex-start; }
        .layout-text .card-image-wrap { display: none; }
        .layout-text .news-content { flex-direction: row; justify-content: space-between; width: 100%; }
        .layout-text .card-header { display: none; }
        .layout-text .news-title { font-size: 0.98rem; font-weight: 700; display: block; margin: 0 0 4px 0; }
        .layout-text .news-title.bn-title { font-size: calc(0.98rem * 0.9); }
        .layout-text .snippet { font-size: 0.8rem; margin: 0 0 6px 0; -webkit-line-clamp: 2; flex-grow: 0; }
        .layout-text .meta { font-size: 0.7rem; margin-top: 0; }
        .layout-text .text-only-tags { display: inline-flex; }
        .layout-text .bookmark-wrap { display: flex; align-items: center; gap: 4px; flex-shrink: 0; margin-left: 15px; }

        .hero-carousel { grid-column: 1 / -1; position: relative; height: 50vh; border-radius: var(--radius); overflow: hidden; margin-bottom: 4px; background: var(--paper-raised); touch-action: pan-y; width: 100%; }
        .carousel-slide { position: absolute; inset: 0; display: flex; flex-direction: column; justify-content: flex-end; opacity: 0; transition: opacity 0.4s ease; pointer-events: none; }
        .carousel-slide.active { opacity: 1; pointer-events: auto; }
        .hero-full-link { position: absolute; inset: 0; z-index: 10; }
        .carousel-slide .card-image-wrap { position: absolute; inset: 0; width: 100%; height: 100%; aspect-ratio: auto; margin: 0; border-radius: 0; z-index: 1; }
        .carousel-slide .news-image { width: 100%; height: 100%; object-fit: cover; max-height: none; }
        .carousel-slide .hero-overlay { position: absolute; inset: 0; background: linear-gradient(to bottom, transparent 25%, rgba(0,0,0,0.88) 100%); z-index: 2; }
        .wire-stamp { position: absolute; top: 14px; left: 14px; z-index: 12; font-family: var(--font-mono); font-size: 0.68rem; font-weight: 600; color: #fff; background: var(--wire); padding: 4px 10px; border-radius: 3px; text-transform: uppercase; letter-spacing: 0.06em; pointer-events: none; }
        .carousel-slide .news-content { position: relative; z-index: 11; padding: 20px; padding-top: 40px; display: flex; flex-direction: column; justify-content: flex-end; gap: 8px; pointer-events: none; height: 100%; }
        .carousel-slide .news-content a, .carousel-slide .news-content button { pointer-events: auto; }
        .carousel-slide .tag { background: rgba(255,255,255,0.15); border: none; color: #fff; width: fit-content; }
        .carousel-slide .news-title { color: #fff; font-size: 1.35rem; }
        .carousel-slide .news-title.bn-title { font-size: calc(1.35rem * 0.9); }
        .carousel-slide .news-title:hover { color: #fff; text-decoration: underline; }
        .carousel-slide .snippet { display: none; }
        .carousel-slide .meta, .carousel-slide .bookmark-btn { color: #d4d4d8; }
        .carousel-slide .bookmark-btn:hover { color: #fff; background: rgba(255,255,255,0.15); }
        .carousel-progress-bar { position: absolute; bottom: 0; left: 0; height: 3px; background: var(--wire); width: 0%; z-index: 25; transition: width linear; }
        .carousel-slide.active .carousel-progress-bar { width: 100%; transition-duration: 5s; }
        .carousel-nav { position: absolute; top: 50%; transform: translateY(-50%); z-index: 20; background: rgba(0,0,0,0.35); color: white; border: none; width: 36px; height: 36px; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; }
        .carousel-nav:hover { background: rgba(0,0,0,0.6); }
        .carousel-nav.prev { left: 12px; } .carousel-nav.next { right: 12px; }
        @media (max-width: 639px) { .carousel-nav { display: none; } }
        .carousel-dots { position: absolute; bottom: 12px; left: 50%; transform: translateX(-50%); display: flex; gap: 7px; z-index: 20; }
        .dot { width: 7px; height: 7px; border-radius: 50%; background: rgba(255,255,255,0.4); cursor: pointer; }
        .dot.active { background: #fff; transform: scale(1.25); }
        @media (min-width: 768px) {
            .carousel-slide .news-content { flex-direction: row; align-items: flex-end; justify-content: space-between; padding: 36px; gap: 30px; }
            .carousel-slide .content-main { flex: 1; max-width: 66%; display: flex; flex-direction: column; justify-content: flex-end; gap: 10px; }
            .carousel-slide .news-title { font-size: 2rem; }
            .carousel-slide .news-title.bn-title { font-size: calc(2rem * 0.9); }
            .carousel-slide .bookmark-wrap { display: flex; flex-direction: column; align-items: flex-end; gap: 14px; margin-left: 0; }
        }

        .skeleton-card { display: flex; flex-direction: column; }
        .skeleton-block { background: linear-gradient(90deg, var(--paper-raised) 25%, var(--line) 50%, var(--paper-raised) 75%); background-size: 200% 100%; animation: shimmer 1.4s ease infinite; border-radius: var(--radius); }
        @keyframes shimmer { from { background-position: 200% 0; } to { background-position: -200% 0; } }
        .skeleton-img { width: 100%; aspect-ratio: 16/10; margin-bottom: 12px; }
        .skeleton-line { height: 14px; margin-bottom: 8px; }
        @media (prefers-reduced-motion: reduce) { .skeleton-block { animation: none; } }

        .state-panel { grid-column: 1 / -1; text-align: center; padding: 4.5rem 1rem; }
        .state-title { font-family: var(--font-display); font-size: 1.2rem; font-weight: 700; margin-bottom: 6px; }
        .state-body { color: var(--ink-muted); font-size: 0.9rem; margin-bottom: 16px; }

    <script>
        // ==========================================
        // CLOUDFLARE WORKER / BASEROW API INTERMEDIARY
        // ==========================================
        const API_WORKER_URL = 'https://amernewsapi.amerhabib.workers.dev/';
        let globalData = [];
        let filteredData = [];
        const itemsPerPage = 23;
        let currentDisplayed = itemsPerPage;

        const CACHE_KEY = 'amernews_data';
        const CACHE_TIME_KEY = 'amernews_time';
        const CACHE_TTL = 3 * 60 * 1000;

        let isFetching = false;
        let fetchPageNum = 1; // Server page tracker for incremental Load More

        let activeCategories = safeParse(localStorage.getItem('newsCategories'), ['All']);
        let activeSources = safeParse(localStorage.getItem('newsSources'), ['All']);
        let activeLanguages = safeParse(localStorage.getItem('newsLanguages'), ['All']);
        let currentView = localStorage.getItem('newsView') || (window.innerWidth < 768 ? 'grid-2' : 'grid-4');
        let searchDebounce = null;

        let carouselInterval, currentSlide = 0, carouselTotal = 0, touchStartX = null;
        let readArticles = safeParse(localStorage.getItem('readArticles'), []);
        let bookmarks = safeParse(localStorage.getItem('bookmarks'), []);

        function safeParse(str, fallback) { try { const v = JSON.parse(str); return Array.isArray(v) ? v : fallback; } catch (e) { return fallback; } }

        function escapeHtml(str) {
            if (str === null || str === undefined) return '';
            return String(str).replace(/&/g, '&').replace(/</g, '<').replace(/>/g, '>').replace(/"/g, '"').replace(/'/g, '&#39;');
        }

        function isBanglaText(str) { return str ? /[\u0980-\u09FF]/.test(str) : false; }

        function hashId(str) {
            let hash = 0;
            for (let i = 0; i < str.length; i++) hash = (hash * 31 + str.charCodeAt(i)) | 0;
            return 'c' + Math.abs(hash).toString(36);
        }

        const svgSun = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2"/><path d="M12 20v2"/><path d="m4.93 4.93 1.41 1.41"/><path d="m17.66 17.66 1.41 1.41"/><path d="M2 12h2"/><path d="M20 12h2"/><path d="m6.34 17.66-1.41 1.41"/><path d="m19.07 4.93-1.41 1.41"/></svg>`;
        const svgMoon = `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z"/></svg>`;
        const svgBookmarkEmpty = `<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m19 21-7-4-7 4V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v16z"/></svg>`;
        const svgBookmarkFilled = `<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="currentColor" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m19 21-7-4-7 4V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v16z"/></svg>`;
        const svgShare = `<svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12v8a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-8"/><polyline points="16 6 12 2 8 6"/><line x1="12" y1="2" x2="12" y2="15"/></svg>`;

        function updateClock() {
            const now = new Date();
            document.getElementById('live-datetime').innerText = now.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit', timeZone: 'Asia/Dhaka' });
        }
        setInterval(updateClock, 60000); updateClock();

        function setupThemeIcon() {
            document.getElementById('theme-btn').innerHTML = document.documentElement.getAttribute('data-theme') === 'dark' ? svgSun : svgMoon;
        }
        setupThemeIcon();

        window.toggleTheme = function() {
            const t = document.documentElement.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
            document.documentElement.setAttribute('data-theme', t);
            localStorage.setItem('theme', t);
            setupThemeIcon();
        }

        window.toggleSearch = function() {
            const el = document.getElementById('search-container');
            const show = el.style.display !== 'block';
            el.style.display = show ? 'block' : 'none';
            if (show) { document.getElementById('search-box').focus(); updateSearchClearBtn(); }
        }

        window.toggleModal = function(id) { document.getElementById(id).style.display = 'flex'; }
        document.getElementById('login-modal').addEventListener('click', function(e) { if (e.target === this) this.style.display = 'none'; });

        window.addEventListener('scroll', () => { document.getElementById('back-to-top').style.display = window.scrollY > 400 ? 'flex' : 'none'; });

        window.toggleFilterAccordion = function() {
            const details = document.getElementById('filter-details');
            details.open = !details.open;
            if (details.open) window.scrollTo({ top: details.getBoundingClientRect().top + window.pageYOffset - 90, behavior: 'smooth' });
        }

        function showToast(m) { const t = document.getElementById('toast'); t.innerText = m; t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 2200); }

        function getRelativeTime(dateStr) {
            if (!dateStr) return '';
            const d = Math.floor((new Date() - new Date(dateStr)) / 1000);
            if (d < 60) return "Just now";
            const m = Math.floor(d / 60);
            if (m < 60) return m + " min ago";
            const h = Math.floor(m / 60);
            if (h < 24) return h + " hr ago";
            const days = Math.floor(h / 24);
            return days === 1 ? "Yesterday" : days + " days ago";
        }

        function parseTags(item) {
            if (!item || !item.tags) return [];
            let raw = item.tags;
            if (Array.isArray(raw)) return raw.map(t => typeof t === 'string' ? t : (t && t.value) || (t && t.name) || null).filter(Boolean);
            if (typeof raw === 'string') {
                raw = raw.trim(); if (!raw) return [];
                try { const p = JSON.parse(raw.replace(/'/g, '"')); return Array.isArray(p) ? p.map(t => typeof t === 'string' ? t : (t && t.value) || (t && t.name) || null).filter(Boolean) : (typeof p === 'string' ? [p] : []); }
                catch (e) { const parts = raw.replace(/[\[\]{}"']/g, '').split(',').map(t => t.trim()).filter(Boolean); return parts.length ? parts : [raw]; }
            }
            return [];
        }

        function applyView(viewType) {
            if (viewType === 'masonry' && window.innerWidth < 768) viewType = 'grid-2';
            currentView = viewType;
            localStorage.setItem('newsView', viewType);
            document.getElementById('news-container').className = 'layout-' + viewType;
            document.querySelectorAll('.seg-btn').forEach(b => b.classList.toggle('active', b.dataset.view === viewType));
            positionSegSlider();
            renderArticles();
        }

        function positionSegSlider() {
            const a = document.querySelector('.seg-btn.active'), s = document.getElementById('seg-slider');
            if (a && s && window.getComputedStyle(a).display !== 'none') { s.style.width = a.offsetWidth + 'px'; s.style.transform = 'translateX(' + a.offsetLeft + 'px)'; }
        }
        window.addEventListener('resize', positionSegSlider);

        document.getElementById('layout-segmented').addEventListener('click', e => { const b = e.target.closest('.seg-btn'); if (b) applyView(b.dataset.view); });

        function updateSearchClearBtn() { document.getElementById('search-clear-btn').style.display = document.getElementById('search-box').value ? 'flex' : 'none'; }

        window.clearSearch = function() {
            document.getElementById('search-box').value = '';
            updateSearchClearBtn();
            applyFiltersAndSort();
            document.getElementById('search-box').focus();
        }

        window.clearAllFilters = function() {
            activeCategories = ['All']; activeSources = ['All']; activeLanguages = ['All'];
            localStorage.setItem('newsCategories', JSON.stringify(['All']));
            localStorage.setItem('newsSources', JSON.stringify(['All']));
            localStorage.setItem('newsLanguages', JSON.stringify(['All']));
            setupFilters();
            fetchArticlesFromWorker(true);
            showToast("Filters cleared");
        }

        function computeContextualTags() {
            const tags = new Set();
            globalData.forEach(item => {
                const itemLang = isBanglaText(item.title) ? 'Bangla' : 'English';
                if (!activeLanguages.includes('All') && !activeLanguages.includes(itemLang)) return;
                const src = item.source_name || 'Unknown';
                if (!activeSources.includes('All') && !activeSources.includes(src)) return;
                parseTags(item).forEach(t => { if (t && t !== item.source_name) tags.add(t); });
            });
            return Array.from(tags).sort();
        }

        function computeContextualSources() {
            const sources = new Set();
            globalData.forEach(item => {
                const itemLang = isBanglaText(item.title) ? 'Bangla' : 'English';
                if (!activeLanguages.includes('All') && !activeLanguages.includes(itemLang)) return;
                if (!activeCategories.includes('All')) {
                    const itemTags = parseTags(item);
                    if (!activeCategories.some(cat => itemTags.includes(cat))) return;
                }
                if (item.source_name) sources.add(item.source_name);
            });
            return Array.from(sources).sort();
        }

        function setupFilters() {
            const contextualTags = computeContextualTags();
            const tagContainer = document.getElementById('filter-container');
            tagContainer.innerHTML = '<button class="capsule ' + (activeCategories.includes('All') ? 'active' : '') + '" data-category="All">All topics</button>';
            contextualTags.forEach(cat => {
                tagContainer.innerHTML += '<button class="capsule ' + (activeCategories.includes(cat) ? 'active' : '') + '" data-category="' + escapeHtml(cat) + '">' + escapeHtml(cat) + '</button>';
            });

            const contextualSources = computeContextualSources();
            const sourceContainer = document.getElementById('source-filter-container');
            sourceContainer.innerHTML = '<button class="capsule ' + (activeSources.includes('All') ? 'active' : '') + '" data-source="All">All sources</button>';
            contextualSources.forEach(src => {
                sourceContainer.innerHTML += '<button class="capsule ' + (activeSources.includes(src) ? 'active' : '') + '" data-source="' + escapeHtml(src) + '">' + escapeHtml(src) + '</button>';
            });

            document.querySelectorAll('#lang-filter-container .capsule').forEach(btn => btn.classList.toggle('active', activeLanguages.includes(btn.dataset.lang)));
        }

        function handleMultiSelect(clickedVal, currentArray, allVal) {
            if (clickedVal === allVal) return [allVal];
            let next = currentArray.filter(v => v !== allVal);
            if (next.includes(clickedVal)) next = next.filter(v => v !== clickedVal);
            else next.push(clickedVal);
            return next.length === 0 ? [allVal] : next;
        }

        document.getElementById('filter-container').addEventListener('click', e => {
            const btn = e.target.closest('.capsule'); if (!btn) return;
            activeCategories = handleMultiSelect(btn.dataset.category, activeCategories, 'All');
            localStorage.setItem('newsCategories', JSON.stringify(activeCategories));
            setupFilters();
            applyFiltersAndSort();
        });

        document.getElementById('source-filter-container').addEventListener('click', e => {
            const btn = e.target.closest('.capsule'); if (!btn) return;
            activeSources = handleMultiSelect(btn.dataset.source, activeSources, 'All');
            localStorage.setItem('newsSources', JSON.stringify(activeSources));
            setupFilters();
            applyFiltersAndSort();
        });

        document.getElementById('lang-filter-container').addEventListener('click', e => {
            const btn = e.target.closest('.capsule'); if (!btn) return;
            activeLanguages = handleMultiSelect(btn.dataset.lang, activeLanguages, 'All');
            localStorage.setItem('newsLanguages', JSON.stringify(activeLanguages));
            setupFilters();
            applyFiltersAndSort();
        });

        document.getElementById('search-box').addEventListener('input', () => {
            updateSearchClearBtn();
            clearTimeout(searchDebounce);
            searchDebounce = setTimeout(() => {
                const term = document.getElementById('search-box').value.trim();
                if (term) {
                    // Always hit the API/worker for search — fresh results from the base
                    currentDisplayed = itemsPerPage;
                    fetchPageNum = 1;
                    fetchArticlesFromWorker(true);
                } else {
                    applyFiltersAndSort();
                }
            }, 400);
        });

        document.getElementById('sort-box').addEventListener('change', applyFiltersAndSort);

        function loadFromCache() {
            const cachedTime = localStorage.getItem(CACHE_TIME_KEY);
            const cachedData = localStorage.getItem(CACHE_KEY);
            if (cachedTime && cachedData) {
                try {
                    const data = JSON.parse(cachedData);
                    if (data.length > 0) {
                        globalData = data;
                        setupFilters();
                        renderTicker(globalData.slice(0, 12));
                        currentDisplayed = itemsPerPage;
                        applyFiltersAndSort();
                        setTimeout(positionSegSlider, 50);
                        return true;
                    }
                } catch (e) {}
            }
            return false;
        }

        // ==========================================
        // FETCH: Two modes —
        //   1) refresh (pages 1+2, merge with cache)
        //   2) loadMore (incremental page N, append to globalData)
        // ==========================================
        async function fetchArticlesFromWorker(force = false, isLoadMoreCall = false) {
            if (isFetching) return;
            isFetching = true;

            try {
                const searchTerm = document.getElementById('search-box').value.trim();
                const now = Date.now();

                // Cache guard: skip if cache is fresh AND this is not a load-more call AND not forced
                if (!force && !isLoadMoreCall && !searchTerm && globalData.length > 0) {
                    const cachedTime = localStorage.getItem(CACHE_TIME_KEY);
                    if (cachedTime && (now - Number(cachedTime) < CACHE_TTL)) {
                        setupFilters();
                        renderTicker(globalData.slice(0, 12));
                        currentDisplayed = itemsPerPage;
                        applyFiltersAndSort();
                        setTimeout(positionSegSlider, 50);
                        isFetching = false;
                        return;
                    }
                }

                if (globalData.length === 0) renderSkeletons(8);

                const existingUrls = new Set(globalData.map(item => item.url));

                if (isLoadMoreCall) {
                    // === LOAD MORE: fetch the NEXT server page incrementally ===
                    const queryParams = new URLSearchParams({ page: fetchPageNum.toString(), size: '100' });
                    if (searchTerm) queryParams.append('search', searchTerm);
                    const res = await fetch(API_WORKER_URL + '?' + queryParams.toString());

                    if (res.ok) {
                        const newData = await res.json();
                        let added = 0;
                        if (Array.isArray(newData)) {
                            newData.forEach(item => {
                                if (item.url && !existingUrls.has(item.url)) {
                                    globalData.push(item);
                                    existingUrls.add(item.url);
                                    added++;
                                }
                            });
                        }
                        if (added > 0) fetchPageNum++;
                    }
                    currentDisplayed += itemsPerPage;

                } else {
                    // === FRESH FETCH / REFRESH: pages 1+2 concurrently ===
                    const fetchPage = async (page) => {
                        const qp = new URLSearchParams({ page: page.toString(), size: '200' });
                        if (searchTerm) qp.append('search', searchTerm);
                        const r = await fetch(API_WORKER_URL + '?' + qp.toString());
                        return r.ok ? await r.json() : [];
                    };

                    const [page1, page2] = await Promise.all([fetchPage(1), fetchPage(2)]);
                    const rawData = [...(page1 || []), ...(page2 || [])];

                    const freshUrls = new Set();
                    const freshItems = rawData.filter(item => {
                        if (!item.url || freshUrls.has(item.url)) return false;
                        freshUrls.add(item.url);
                        return true;
                    });

                    const merged = [...globalData];
                    freshItems.forEach(item => {
                        if (!existingUrls.has(item.url)) {
                            merged.push(item);
                            existingUrls.add(item.url);
                        }
                    });
                    globalData = merged;
                    fetchPageNum = 3; // Next load-more starts at page 3
                    currentDisplayed = itemsPerPage;
                }

                if (!searchTerm && globalData.length > 0) {
                    try { localStorage.setItem(CACHE_KEY, JSON.stringify(globalData)); localStorage.setItem(CACHE_TIME_KEY, now.toString()); } catch (e) {}
                }

                if (globalData.length > 0) {
                    setupFilters();
                    renderTicker(globalData.slice(0, 12));
                } else {
                    document.getElementById('ticker-bar').style.display = 'none';
                }

                applyFiltersAndSort();
                setTimeout(positionSegSlider, 50);

            } catch (error) {
                console.error("Worker API Error:", error);
                document.getElementById('ticker-bar').style.display = 'none';
                if (globalData.length === 0) renderErrorState();
            } finally {
                isFetching = false;
            }
        }

        function applyFiltersAndSort() {
            const sortMode = document.getElementById('sort-box').value || 'newest';
            const searchTerm = document.getElementById('search-box').value.trim().toLowerCase();
            filteredData = [...globalData];

            if (sortMode === 'bookmarks') filteredData = filteredData.filter(item => bookmarks.includes(item.url));

            if (!activeLanguages.includes('All')) {
                filteredData = filteredData.filter(item => activeLanguages.includes(isBanglaText(item.title) ? 'Bangla' : 'English'));
            }
            if (!activeSources.includes('All')) {
                filteredData = filteredData.filter(item => activeSources.includes(item.source_name));
            }
            if (!activeCategories.includes('All')) {
                filteredData = filteredData.filter(item => {
                    const tags = parseTags(item);
                    return activeCategories.some(cat => tags.includes(cat));
                });
            }
            if (searchTerm) {
                filteredData = filteredData.filter(item => {
                    const title = (item.title || '').toLowerCase();
                    const summary = (item.summary || '').toLowerCase();
                    const source = (item.source_name || '').toLowerCase();
                    const tagStr = parseTags(item).map(t => t.toLowerCase()).join(' ');
                    return title.includes(searchTerm) || summary.includes(searchTerm) || source.includes(searchTerm) || tagStr.includes(searchTerm);
                });
            }

            if (sortMode === 'oldest') filteredData.sort((a, b) => new Date(a.published_at || 0) - new Date(b.published_at || 0));
            else if (sortMode !== 'bookmarks') filteredData.sort((a, b) => new Date(b.published_at || 0) - new Date(a.published_at || 0));

            setupFilters();
            renderArticles();
        }

        // Called by IntersectionObserver when sentinel scrolls into view
        function infiniteScrollTrigger() {
            if (isFetching) return;
            fetchArticlesFromWorker(false, true);
        }

        window.filterByTag = function(tag) {
            if (!activeCategories.includes(tag)) {
                activeCategories = [tag];
                localStorage.setItem('newsCategories', JSON.stringify(activeCategories));
                setupFilters();
                applyFiltersAndSort();
            }
            window.scrollTo({ top: 400, behavior: 'smooth' });
        }

        function markRead(url) {
            if (!readArticles.includes(url)) {
                readArticles.push(url);
                localStorage.setItem('readArticles', JSON.stringify(readArticles));
                const card = document.getElementById(hashId(url));
                if (card) card.classList.add('read');
            }
        }

        function toggleBookmark(url) {
            const nowSaved = !bookmarks.includes(url);
            bookmarks = nowSaved ? [...bookmarks, url] : bookmarks.filter(l => l !== url);
            localStorage.setItem('bookmarks', JSON.stringify(bookmarks));
            document.querySelectorAll('.bookmark-btn[data-url="' + cssEscape(url) + '"]').forEach(btn => {
                btn.innerHTML = nowSaved ? svgBookmarkFilled : svgBookmarkEmpty;
                btn.classList.toggle('saved', nowSaved);
            });
            if (document.getElementById('sort-box').value === 'bookmarks') applyFiltersAndSort();
        }

        window.handleShare = async function(title, url) {
            if (navigator.share && window.innerWidth < 1024) {
                try { await navigator.share({ title, url }); } catch (err) { if (err.name !== 'AbortError') fallbackCopyUrl(url); }
            } else fallbackCopyUrl(url);
        }

        function fallbackCopyUrl(url) { navigator.clipboard.writeText(url).then(() => showToast("Link copied to clipboard!")).catch(() => prompt("Copy link:", url)); }

        function cssEscape(str) { return window.CSS && CSS.escape ? CSS.escape(str) : str.replace(/["\\]/g, '\\$&'); }

        document.getElementById('news-container').addEventListener('click', e => {
            const bk = e.target.closest('.bookmark-btn');
            if (bk) { e.preventDefault(); toggleBookmark(bk.dataset.url); return; }
            const sh = e.target.closest('.share-btn');
            if (sh) { e.preventDefault(); handleShare(sh.dataset.title, sh.dataset.url); return; }
            const tg = e.target.closest('.tag[data-tag]');
            if (tg) { e.preventDefault(); filterByTag(tg.dataset.tag); return; }
            const ln = e.target.closest('a[data-url]');
            if (ln) markRead(ln.dataset.url);
        });

        function buildCarouselHtml(items) {
            carouselTotal = items.length; currentSlide = 0;
            const slidesHtml = items.map((item, index) => {
                const bm = bookmarks.includes(item.url), st = item.source_name || 'News';
                const tt = parseTags(item).filter(t => t !== st && t !== 'Top News');
                const u = escapeHtml(item.url), ti = escapeHtml(item.title), bn = isBanglaText(item.title);
                const tagsHtml = ['<span class="tag" data-tag="' + escapeHtml(st) + '">' + escapeHtml(st) + '</span>', ...tt.map(t => '<span class="tag" data-tag="' + escapeHtml(t) + '">' + escapeHtml(t) + '</span>')].join('');
                return '<div class="carousel-slide ' + (index === 0 ? 'active' : '') + '" id="slide-' + index + '">'
                    + '<span class="wire-stamp">Top story</span>'
                    + '<a href="' + u + '" target="_blank" rel="noopener" data-url="' + u + '" class="hero-full-link" aria-label="' + ti + '"></a>'
                    + '<div class="card-image-wrap">' + (item.image_url ? '<img src="' + escapeHtml(item.image_url) + '" class="news-image" alt="">' : '') + '<div class="hero-overlay"></div></div>'
                    + '<div class="news-content"><div class="content-main"><div class="tags-group">' + tagsHtml + '</div>'
                    + '<a class="news-title ' + (bn ? 'bn-title' : '') + '" href="' + u + '" target="_blank" rel="noopener" data-url="' + u + '">' + ti + '</a></div>'
                    + '<div class="bookmark-wrap"><div style="display:flex; gap:4px;">'
                    + '<button class="bookmark-btn ' + (bm ? 'saved' : '') + '" data-url="' + u + '" title="Save">' + (bm ? svgBookmarkFilled : svgBookmarkEmpty) + '</button>'
                    + '<button class="share-btn" data-url="' + u + '" data-title="' + ti + '" title="Share">' + svgShare + '</button></div>'
                    + '<div class="meta"><span>' + getRelativeTime(item.published_at) + '</span></div></div></div>'
                    + '<div class="carousel-progress-bar"></div></div>';
            }).join('');
            const dotsHtml = items.map((_, i) => '<div class="dot ' + (i === 0 ? 'active' : '') + '" data-slide="' + i + '" id="dot-' + i + '"></div>').join('');
            return '<div class="hero-carousel" id="hero-carousel" onmouseenter="pauseCarousel()" onmouseleave="resumeCarousel()">' + slidesHtml
                + '<button class="carousel-nav prev" onclick="moveSlide(-1)">&#10094;</button>'
                + '<button class="carousel-nav next" onclick="moveSlide(1)">&#10095;</button>'
                + '<div class="carousel-dots">' + dotsHtml + '</div></div>';
        }

        window.moveSlide = function(step) {
            let ns = currentSlide + step;
            if (ns >= carouselTotal) ns = 0; if (ns < 0) ns = carouselTotal - 1;
            goToSlide(ns);
        }

        function goToSlide(index) {
            document.querySelectorAll('.carousel-slide').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.dot').forEach(d => d.classList.remove('active'));
            const slide = document.getElementById('slide-' + index), dot = document.getElementById('dot-' + index);
            if (slide) slide.classList.add('active'); if (dot) dot.classList.add('active');
            currentSlide = index;
            resetCarouselTimer();
        }

        function startCarouselTimer() {
            clearInterval(carouselInterval);
            if (!window.matchMedia('(prefers-reduced-motion: reduce)').matches) carouselInterval = setInterval(() => { moveSlide(1); }, 5000);
        }

        window.pauseCarousel = function() {
            clearInterval(carouselInterval);
            const ab = document.querySelector('.carousel-slide.active .carousel-progress-bar');
            if (ab) { ab.style.transition = 'none'; ab.style.width = window.getComputedStyle(ab).width; }
        }

        window.resumeCarousel = function() {
            const ab = document.querySelector('.carousel-slide.active .carousel-progress-bar');
            if (ab) {
                const cw = parseFloat(window.getComputedStyle(ab).width), pw = ab.parentElement.offsetWidth;
                ab.style.transition = 'width ' + (5000 * (1 - cw / pw)) + 'ms linear'; ab.style.width = '100%';
            }
            startCarouselTimer();
        }

        function resetCarouselTimer() {
            const ab = document.querySelector('.carousel-slide.active .carousel-progress-bar');
            if (ab) { ab.style.transition = 'none'; ab.style.width = '0%'; setTimeout(() => { ab.style.transition = 'width 5s linear'; ab.style.width = '100%'; }, 50); }
            startCarouselTimer();
        }

        function setupCarouselSwipe(el) {
            el.addEventListener('touchstart', e => { touchStartX = e.touches[0].clientX; }, { passive: true });
            el.addEventListener('touchend', e => {
                if (touchStartX === null) return;
                const delta = e.changedTouches[0].clientX - touchStartX;
                if (Math.abs(delta) > 40) moveSlide(delta < 0 ? 1 : -1);
                touchStartX = null;
            }, { passive: true });
        }

        function renderTicker(items) {
            const bar = document.getElementById('ticker-bar');
            if (!items.length) { bar.style.display = 'none'; return; }
            bar.style.display = 'flex';
            const headlines = items.map(item => '<a href="' + escapeHtml(item.url) + '" target="_blank" rel="noopener" data-url="' + escapeHtml(item.url) + '">' + escapeHtml(item.title) + '</a>').join('<span class="ticker-sep">&nbsp;&#8226;&nbsp;</span>');
            const track = document.getElementById('ticker-track');
            track.innerHTML = headlines + '<span class="ticker-sep">&nbsp;&#8226;&nbsp;</span>' + headlines;
            track.querySelectorAll('a').forEach(a => a.addEventListener('click', () => markRead(a.dataset.url)));
        }

        function buildCardHtml(item, index = 0) {
            const isRead = readArticles.includes(item.url), isBookmarked = bookmarks.includes(item.url);
            const cardId = hashId(item.url), snippet = item.summary || '', sourceTag = item.source_name || 'News';
            const topicTags = parseTags(item).filter(t => t !== sourceTag && t !== 'Top News');
            const url = escapeHtml(item.url), titleStr = escapeHtml(item.title), isBn = isBanglaText(item.title);
            const hasImage = Boolean(item.image_url), isMasonry = currentView === 'masonry';
            const spanClass = (isMasonry && (index % 5 === 0 || index % 7 === 1)) ? 'span-2' : '';
            const noImageCardClass = (!hasImage && isMasonry) ? 'no-image-card' : '';
            const imageHtml = hasImage
                ? '<a href="' + url + '" target="_blank" rel="noopener" data-url="' + url + '" class="card-image-wrap"><img src="' + escapeHtml(item.image_url) + '" alt="" class="news-image" loading="lazy"></a>'
                : (isMasonry ? '' : '<div class="card-image-wrap"><span class="no-image-placeholder">No image</span></div>');
            const allTagsHtml = ['<span class="tag" data-tag="' + escapeHtml(sourceTag) + '">' + escapeHtml(sourceTag) + '</span>',
                ...topicTags.map(t => '<span class="tag" data-tag="' + escapeHtml(t) + '">' + escapeHtml(t) + '</span>')].join('');

            if (!hasImage && isMasonry) {
                return '<div id="' + cardId + '" class="news-card ' + spanClass + ' ' + noImageCardClass + ' ' + (isRead ? 'read' : '') + '">'
                    + '<div class="news-content"><div class="content-main">'
                    + '<div class="card-header"><div class="tags-group">' + allTagsHtml + '</div>'
                    + '<div class="card-actions-group">'
                    + '<button class="bookmark-btn ' + (isBookmarked ? 'saved' : '') + '" data-url="' + url + '" title="Save">' + (isBookmarked ? svgBookmarkFilled : svgBookmarkEmpty) + '</button>'
                    + '<button class="share-btn" data-url="' + url + '" data-title="' + titleStr + '" title="Share">' + svgShare + '</button></div></div>'
                    + '<a class="news-title ' + (isBn ? 'bn-title' : '') + '" href="' + url + '" target="_blank" rel="noopener" data-url="' + url + '">' + titleStr + '</a>'
                    + (snippet ? '<div class="snippet">' + escapeHtml(snippet) + '</div>' : '')
                    + '<div class="meta"><span>' + getRelativeTime(item.published_at) + '</span></div></div></div></div>';
            }

            return '<div id="' + cardId + '" class="news-card ' + spanClass + ' ' + (isRead ? 'read' : '') + '">' + imageHtml
                + '<div class="news-content"><div class="content-main">'
                + '<div class="card-header"><div class="tags-group">' + allTagsHtml + '</div>'
                + '<div class="card-actions-group">'
                + '<button class="bookmark-btn ' + (isBookmarked ? 'saved' : '') + '" data-url="' + url + '" title="Save">' + (isBookmarked ? svgBookmarkFilled : svgBookmarkEmpty) + '</button>'
                + '<button class="share-btn" data-url="' + url + '" data-title="' + titleStr + '" title="Share">' + svgShare + '</button></div></div>'
                + '<a class="news-title ' + (isBn ? 'bn-title' : '') + '" href="' + url + '" target="_blank" rel="noopener" data-url="' + url + '">' + titleStr + '</a>'
                + (snippet ? '<div class="snippet">' + escapeHtml(snippet) + '</div>' : '')
                + '<div class="meta"><span>' + getRelativeTime(item.published_at) + '</span><div class="text-only-tags">' + allTagsHtml + '</div></div></div>'
                + '<div class="bookmark-wrap">'
                + '<button class="bookmark-btn ' + (isBookmarked ? 'saved' : '') + '" data-url="' + url + '" title="Save">' + (isBookmarked ? svgBookmarkFilled : svgBookmarkEmpty) + '</button>'
                + '<button class="share-btn" data-url="' + url + '" data-title="' + titleStr + '" title="Share">' + svgShare + '</button></div></div></div>';
        }

        function renderSkeletons(count) {
            let html = '';
            for (let i = 0; i < count; i++) html += '<div class="skeleton-card"><div class="skeleton-block skeleton-img"></div><div class="skeleton-block skeleton-line" style="width:85%"></div><div class="skeleton-block skeleton-line" style="width:60%"></div></div>';
            document.getElementById('news-container').innerHTML = html;
        }

        function renderEmptyState() {
            document.getElementById('news-container').innerHTML = '<div class="state-panel"><div class="state-title">No articles match these filters</div><div class="state-body">Try a different topic, source, or language — or clear your search.</div><button class="state-action" onclick="resetFilters()">Clear filters</button></div>';
        }

        function renderErrorState() {
            document.getElementById('news-container').innerHTML = '<div class="state-panel"><div class="state-title">Couldn\'t load the feed</div><div class="state-body">The connection to the news source failed. Check your connection and try again.</div><button class="state-action" onclick="fetchArticlesFromWorker(true)">Retry</button></div>';
        }

        window.resetFilters = function() {
            activeCategories = ['All']; activeSources = ['All']; activeLanguages = ['All'];
            localStorage.setItem('newsCategories', JSON.stringify(['All']));
            localStorage.setItem('newsSources', JSON.stringify(['All']));
            localStorage.setItem('newsLanguages', JSON.stringify(['All']));
            document.getElementById('search-box').value = '';
            document.getElementById('sort-box').value = 'newest';
            updateSearchClearBtn();
            setupFilters();
            applyFiltersAndSort();
        }

        function renderArticles() {
            const container = document.getElementById('news-container');
            if (carouselInterval) clearInterval(carouselInterval);
            if (filteredData.length === 0) { renderEmptyState(); return; }

            let itemsToRender = filteredData.slice(0, currentDisplayed);
            let html = '';
            const showCarousel = currentView !== 'text';

            if (showCarousel && itemsToRender.length >= 3) {
                html += buildCarouselHtml(itemsToRender.slice(0, 3));
                itemsToRender.slice(3).forEach((item, idx) => html += buildCardHtml(item, idx));
            } else {
                itemsToRender.forEach((item, idx) => html += buildCardHtml(item, idx));
            }
            container.innerHTML = html;
            // No load-more button — infinite scroll via IntersectionObserver

            if (showCarousel && itemsToRender.length >= 3) {
                const carouselEl = document.getElementById('hero-carousel');
                const dotsContainer = carouselEl.querySelector('.carousel-dots');
                if (dotsContainer) dotsContainer.addEventListener('click', e => { const dot = e.target.closest('.dot'); if (dot) goToSlide(Number(dot.dataset.slide)); });
                setupCarouselSwipe(carouselEl);
                startCarouselTimer();
            }
        }

        // INFINITE SCROLL — IntersectionObserver on the sentinel
        const scrollObserver = new IntersectionObserver((entries) => {
            entries.forEach(entry => {
                if (entry.isIntersecting && !isFetching) {
                    infiniteScrollTrigger();
                }
            });
        }, { rootMargin: '200px' });

        const sentinel = document.getElementById('scroll-sentinel');
        if (sentinel) scrollObserver.observe(sentinel);

        // INIT
        applyView(currentView);
        const cacheHit = loadFromCache();
        fetchArticlesFromWorker(cacheHit ? false : true);
        setInterval(() => { if (!document.hidden) fetchArticlesFromWorker(true); }, 3 * 60 * 1000);
    </script>
</body>
