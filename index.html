<!DOCTYPE html>
<html lang="en">
<head>
    <meta name="description" content="Amer.News delivers the latest breaking daily news, curated and updated in real-time from top English and Bangla sources.">
    <meta name="keywords" content="news aggregator, breaking news, Bangladesh news, world news, Amer Habib, wire desk">
    <meta name="author" content="Amer Abdal Habib">
    <link rel="canonical" href="https://news.amerhabib.com/">

    <meta property="og:type" content="website">
    <meta property="og:title" content="Amer.News">
    <meta property="og:description" content="The latest daily news curated and delivered in real-time.">
    <meta property="og:image" content="https://raw.githubusercontent.com/amerabdalhabib/amer.news/main/images/socialcard.jpg">
    <meta property="og:image:alt" content="Amer.News — Wire Desk">
    <meta property="og:image:type" content="image/jpeg">
    <meta property="og:image:width" content="1280">
    <meta property="og:image:height" content="720">
    <meta property="og:url" content="https://news.amerhabib.com/">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="Amer.News — Wire Desk">
    <meta name="twitter:description" content="The latest daily news curated and delivered in real-time.">
    <meta name="twitter:image" content="https://raw.githubusercontent.com/amerabdalhabib/amer.news/main/images/socialcard.jpg">
    <meta name="twitter:image:alt" content="Amer.News — Wire Desk">

    <meta charset="UTF-8">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Amer.News</title>

    <link rel="icon" type="image/jpeg" href="https://raw.githubusercontent.com/amerabdalhabib/amer.news/main/images/ah_icon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Archivo+Narrow:wght@600;700;800&family=Inter:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="styles.css">

    <script async src="https://www.googletagmanager.com/gtag/js?id=G-8X1572S1X5"></script>
    <script>
        window.dataLayer = window.dataLayer || [];
        function gtag(){dataLayer.push(arguments);}
        gtag('js', new Date());
        gtag('config', 'G-8X1572S1X5');
    </script>
</head>
<body>
    <div class="sticky-wrapper">
        <div class="container" style="padding-top: 10px; padding-bottom: 0;">
            <header>
                <div class="header-top">
                    <a href="https://news.amerhabib.com/" class="brand-zone" aria-label="Amer.News Home">
                        <img src="https://raw.githubusercontent.com/amerabdalhabib/amer.news/main/images/ah_icon.png" alt="Amer.News logo" class="logo">
                        <div class="brand-text-wrap">
                            <h1>Amer.News</h1>
                            <span class="masthead-tag">Wire desk</span>
                        </div>
                    </a>
                    <div class="utility-zone">
                        <div id="live-datetime" class="live-clock"></div>
                        <button class="icon-btn" onclick="toggleSearch()" title="Search" aria-label="Search articles">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
                        </button>
                        <button class="icon-btn" onclick="fetchArticlesFromWorker({reason: 'refresh', reset: true})" title="Refresh feed" aria-label="Refresh feed">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"/><path d="M3 3v5h5"/></svg>
                        </button>
                        <button id="theme-btn" class="icon-btn" onclick="toggleTheme()" title="Toggle theme" aria-label="Toggle dark mode"></button>
                    </div>
                </div>
                <div id="search-container">
                    <div class="search-wrapper">
                        <input type="text" id="search-box" class="search-box" placeholder="Search..." aria-label="Search articles">
                        <button id="search-clear-btn" class="search-clear" onclick="clearSearch()" title="Clear search" aria-label="Clear search">
                            <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                        </button>
                    </div>
                </div>
            </header>
            <div id="ticker-bar" class="ticker-bar" style="display:none;">
                <div class="ticker-live"><span class="ticker-dot"></span>Live</div>
                <div class="ticker-viewport">
                    <div id="ticker-track" class="ticker-track"></div>
                </div>
            </div>
        </div>
    </div>

    <div class="container">
        <div class="controls-row">
            <select id="sort-box" class="select-box" aria-label="Sort articles">
                <option value="newest">Sort: Newest</option>
                <option value="oldest">Sort: Oldest</option>
                <option value="bookmarks">View: Saved</option>
            </select>
            <div class="layout-controls">
                <button class="customize-feed-btn" onclick="toggleFilterModal()" title="Customize feed" aria-label="Customize feed">
                    <svg xmlns="http://www.w3.org/2000/svg" width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/></svg>
                    <span>Customize Feed</span>
                </button>
                <div class="layout-segmented" id="layout-segmented">
                    <div class="seg-slider" id="seg-slider"></div>
                    <button class="seg-btn" data-view="grid-1" title="Single column"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="3" width="14" height="18" rx="1"/></svg></button>
                    <button class="seg-btn" data-view="grid-2" title="Card layout"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7" height="18" rx="1"/><rect x="14" y="3" width="7" height="18" rx="1"/></svg></button>
                    <button class="seg-btn" data-view="grid-3" title="3 columns"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="5" height="18" rx="1"/><rect x="9.5" y="3" width="5" height="18" rx="1"/><rect x="17" y="3" width="5" height="18" rx="1"/></svg></button>
                    <button class="seg-btn" data-view="grid-4" title="4 columns"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="3" width="3.5" height="18" rx="1"/><rect x="7.5" y="3" width="3.5" height="18" rx="1"/><rect x="13" y="3" width="3.5" height="18" rx="1"/><rect x="18.5" y="3" width="3.5" height="18" rx="1"/></svg></button>
                    <button class="seg-btn" data-view="masonry" title="Newspaper"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="8" rx="1"/><rect x="3" y="13" width="8" height="8" rx="1"/><rect x="13" y="13" width="8" height="8" rx="1"/></svg></button>
                    <button class="seg-btn" data-view="list" title="List"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/></svg></button>
                    <button class="seg-btn" data-view="text" title="Text layout"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg></button>
                </div>
            </div>
        </div>

        <div id="news-status" class="sr-only" role="status" aria-live="polite"></div>
        <div id="news-container" class="layout-grid-4"></div>
        <div id="load-more-container" style="text-align:center; padding: 10px 0 30px; display: none;">
            <button id="load-more-btn" class="load-more-btn" onclick="loadMoreFromApi()">
                <span id="load-more-text">Load more articles</span>
                <span id="load-more-spinner" class="load-more-spinner" style="display:none;"></span>
            </button>
        </div>
        <div id="scroll-sentinel" style="min-height:20px;"></div>
        <footer>Built with &#9829; by <a href="https://amerhabib.com/" target="_blank" rel="noopener">Amer Habib</a></footer>
    </div>

    <div class="floating-stack" id="floating-stack">
        <button id="floating-filter-toggle" class="floating-btn" onclick="toggleFilterModal()" title="Customize feed" aria-label="Customize feed">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="22 3 2 3 10 12.46 10 19 14 21 14 12.46 22 3"/></svg>
        </button>
        <button id="back-to-top" class="floating-btn" onclick="window.scrollTo({top: 0, behavior: 'smooth'})" title="Back to top" aria-label="Back to top">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m18 15-6-6-6 6"/></svg>
        </button>
    </div>

    <div id="filter-modal" class="filter-popover-overlay" onclick="closeFilterModal(event)">
        <div class="filter-popover-card" onclick="event.stopPropagation()">
            <div class="filter-popover-header">
                <div class="filter-popover-title">Customise Feed</div>
                <button class="close-filter-popover" onclick="closeFilterModal()" aria-label="Close filters">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
                </button>
            </div>
            <div class="filter-popover-body">
                <div class="filter-group">
                    <span class="filter-label">Language</span>
                    <div id="lang-filter-container" class="filter-bar">
                        <button class="capsule active" data-lang="All">Both</button>
                        <button class="capsule" data-lang="English">English</button>
                        <button class="capsule" data-lang="Bangla">Bangla</button>
                    </div>
                </div>
                <div class="filter-group">
                    <span class="filter-label">Topics</span>
                    <div id="filter-container" class="filter-bar">
                        <button class="capsule active" data-category="All">All topics</button>
                    </div>
                </div>
                <div class="filter-group">
                    <span class="filter-label">News sources</span>
                    <div id="source-filter-container" class="filter-bar">
                        <button class="capsule active" data-source="All">All sources</button>
                    </div>
                </div>
                <div class="filter-group" style="margin-top: 10px;">
                    <button class="clear-filters-btn" onclick="clearAllFilters()" title="Reset all filters to default">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="1 4 1 10 7 10"/><path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"/></svg>
                        Clear all filters
                    </button>
                </div>
            </div>
        </div>
    </div>

    <div id="toast" class="toast">Link copied to clipboard!</div>

    <div id="login-modal" class="modal-overlay">
        <div class="modal-content" onclick="event.stopPropagation()">
            <button class="close-modal" onclick="document.getElementById('login-modal').style.display='none'" aria-label="Close">
                <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
            </button>
            <div class="modal-title">Sign in to Amer.News</div>
            <div class="form-group"><label for="login-email">Email address</label><input id="login-email" type="email" placeholder="you@example.com"></div>
            <div class="form-group"><label for="login-password">Password</label><input id="login-password" type="password" placeholder="••••••••"></div>
            <button class="modal-btn" onclick="alert('Backend integration coming soon!')">Sign in</button>
            <p style="text-align:center; font-size: 0.75rem; margin-top:15px; color:var(--ink-muted);">This feature is currently in development.</p>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
